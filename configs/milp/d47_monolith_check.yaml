# Does D47's "the monolith solves this instance in 39 s" reproduce?
#
# That claim, and the optimum 1569.44 it carries, is the baseline every Benders result
# in this repository is judged against -- D47 reads the whole Run 1 curve as reaching
# "79% of the monolith's optimum of 1569.44, which the monolith itself produces
# exactly, in 39 s". If the baseline does not reproduce, every one of those readings
# needs restating.
#
# A first attempt at 300 s with CPXPARAM_Threads: 1 returned FEASIBLE, LB 1439.11 /
# UB 2025.11 -- no proof of optimality and nowhere near 39 s. The most likely cause is
# threads: the reproducibility configs in this repository pin Threads to 1 (D26), and
# a monolith run reported at 39 s was probably not single-threaded. This file tests
# exactly that by setting Threads: 0 (all cores) and changing nothing else.
#
# NOTE the tension this exposes, whichever way it lands. D26 requires single-threaded
# runs for reproducibility; a 39 s multi-threaded baseline is not reproducible in that
# sense. The baseline and the thing it is compared against should not be held to
# different standards, and the paper has to state which one it used.

schema:
  name: mobauto2_milp_config
  version: 3

run:
  name: d47_monolith_check
  log_level: INFO
  seed: 42

data:
  # Single scenario, matching baseline_d9.yaml's demand_file.
  scenario_files: [setups/base.yaml, setups/base_plus100_out_noon.yaml, setups/base_ret_peak_adv.yaml, setups/base_vol20_pm60.yaml]

model:
  time:
    T_minutes: 660
    slot_resolution: 15
    trip_duration_minutes: 30
  fleet:
    Q: 3
    initial_battery: [150.0]
    initial_actions: [IDL]
  energy:
    Emax: 150
    L: 30
    delta_chg: 70 / (60 / slot_resolution)
  costs:
    start_cost_epsilon: 0.01
    concurrency_penalty: 0.25

milp:
  # Symmetry breaking is valid here for the same reason it is in the Benders master
  # (2.8): a homogeneous fleet ordered by TOTAL departures. The fleet is homogeneous
  # -- one-element lists above pad by repeating the last entry (4.2).
  use_fifo_symmetry: true
  symmetry_breaking: true
  use_mip_start: true
  # Tight gap: this run exists to produce a reference number, so it must terminate on
  # the gap and not on the clock. A clock-truncated MIP is machine-dependent (D26),
  # and a reference produced that way would be a different number on every machine.
  solve_time_limit_s: 1800
  mipgap: 1.0e-6
  solver_backend: cplex
  cplex_options:
    CPXPARAM_MIP_Strategy_Symmetry: 5
    # Single-threaded for reproducibility, matching baseline_d9.yaml.
    CPXPARAM_Threads: 0

service:
  S: 15
  Wmax_minutes: 60
  p: 50.0
  # Unused on the default aggregate path (aggregate_service_by_start), which is the
  # one that matches the post-D30 subproblem. Left at 0 so it cannot silently
  # perturb the objective if that path is ever switched off.
  fill_first_epsilon: 0.0

solver:
  solver_tee: false
