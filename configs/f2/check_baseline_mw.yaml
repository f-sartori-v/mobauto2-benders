# B2 (handout item, 2026-09-02): f2_check_baseline_mw, identical to check_baseline.yaml
# except subproblem.use_magnanti_wong: true, to re-run F2 under Magnanti-Wong
# selection (now ported to the minute recourse) rather than the plain dual.
# Every other key, including the iteration budget (15) and the generous
# total_time_limit_s, is identical -- so any LB difference against the plain-dual
# arm is attributable to the selection mechanism alone.

schema:
  name: mobauto2_benders_config
  version: 2
run:
  name: f2_check_baseline_mw
  log_level: INFO
  log_file: null
  report_dir: null
  seed: 42
data:
  demand_file: setups/base.yaml
  scenario_files: null
  scenario_weights: null
  R_out: null
  R_ret: null
model:
  time:
    T_minutes: 660
    slot_resolution: 30
    trip_duration_minutes: 30
  fleet:
    Q: 2
    initial_battery:
    - 150.0
    - 150.0
    - 150.0
    initial_actions:
    - IDL
    - IDL
    - IDL
  energy:
    Emax: 150
    L: 30
    delta_chg: 70 / (60 / slot_resolution)
  costs:
    start_cost_epsilon: 0.01
    concurrency_penalty: 0.25
master:
  use_fifo_symmetry: true
  symmetry_breaking: true
  use_mip_start: true
  recourse_lower_bound: false
  per_iteration_time_limit_s: 120
  per_iteration_mipgap: 0.05
  cplex_options:
    CPXPARAM_Preprocessing_Symmetry: 5
    CPXPARAM_Threads: 1
  solver_backend: cplex_direct
  aggregate_cuts_by_tau: true
  theta_per_scenario: false
  cut_coeff_threshold: 0.001
  write_lp_after_cut: false
subproblem:
  multi_cuts_by_scenario: false
  use_magnanti_wong: true
  mw_core_alpha: 0.3
  use_dual_slopes: true
  S: 15
  Wmax_minutes: 60
  p_minutes: 56.0
  recourse_resolution: minute
  departure_policy: start
  degenerate_cut_probe_top_k: 6
  degenerate_cut_zero_tol: 1.0e-09
solver:
  max_iterations: 15
  tolerance: 0.001
  total_time_limit_s: 1800
  stall_max_no_improve_iters: 0
  stall_min_abs_improve: 1.0
  stall_min_rel_improve: 0.002
  master_solver: cplex
  subproblem_solver: cplex_direct
  solver_tee: false
tolerances:
  eps_bin: 1.0e-05
  eps_feas: 1.0e-07
  eps_cut: 1.0e-08
  eps_hash: 1.0e-06
