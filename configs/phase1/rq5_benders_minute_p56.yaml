# RQ5, as the operator reframed it: is DECOMPOSED minute-level Benders faster than the
# minute-level MONOLITH?
#
# WHY THIS CONFIG EXISTS. Every speed comparison this project has run used the wrong
# baseline. D52 compared the decomposition against a SLOT recourse -- a different model.
# D54 compared it against the SLOT monolith -- also a different model, and one whose
# optimum is an UPPER bound on this one (research note v2 section 3). Neither says
# anything about a minute-level method.
#
# The right baseline solves THE SAME MODEL: slot first stage, minute recourse, `y`
# entering the recourse only through the capacity right-hand side (E2). The monolith
# builds exactly that and pins theta to it by equality, so the only difference between
# the two arms is the ALGORITHM. That is the comparison, and it is run by
# `scripts/rq5_minute_vs_monolith.py`.
#
# REGIME. p_minutes = 56, the operator's own indifference (D53): four minutes of delay
# for fourteen passengers buys one more passenger carried. Both arms must be in the same
# regime or neither number means anything -- at p_minutes = 1500 waiting is 4.1% of the
# objective and the minute recourse has almost nothing to decide.
#
# WHAT BINDS. Wall clock, deliberately, at 300 s. `max_iterations` is set high enough
# that it cannot bind first. This is the one place in the repository where a run is
# SUPPOSED to stop on the clock: the question is how far the decomposition gets in a
# fixed budget, not what it reaches given forever. `master_time_limited_solves` in the
# result says how many master solves also stopped on the clock, and any value above zero
# means this particular run is not bit-reproducible (D26). Report it.
#
# Magnanti-Wong stays OFF: `solve_mw_dual` mirrors the SLOT primal and would select duals
# for an LP that is not the one being solved. The plain dual is the honest generator here
# and supports a valid lower bound (spec 2.6).

schema:
  name: mobauto2_benders_config
  version: 2

run:
  name: rq5_benders_minute_p56
  log_level: INFO
  log_file: null
  report_dir: null
  seed: 42

data:
  demand_file: setups/base.yaml
  scenario_files:
  scenario_weights: null
  R_out: null
  R_ret: null

model:
  time:
    T_minutes: 660
    slot_resolution: 30
    trip_duration_minutes: 30
  fleet:
    Q: 2
    initial_battery: [150.0, 150.0, 150.0]
    initial_actions: [IDL, IDL, IDL]
  energy:
    Emax: 150
    L: 30
    delta_chg: 70 / (60 / slot_resolution)
  costs:
    start_cost_epsilon: 0.01
    concurrency_penalty: 0.25

master:
  use_fifo_symmetry: true
  symmetry_breaking: true
  use_mip_start: true
  recourse_lower_bound: false
  per_iteration_time_limit_s: 120
  per_iteration_mipgap: 0.05
  cplex_options:
    CPXPARAM_Preprocessing_Symmetry: 5
    # Single-threaded, matching the monolith arm. A speed comparison in which one arm
    # gets more cores measures the cores.
    CPXPARAM_Threads: 1
  solver_backend: cplex_direct
  aggregate_cuts_by_tau: true
  theta_per_scenario: false
  cut_coeff_threshold: 0.001
  write_lp_after_cut: false

subproblem:
  multi_cuts_by_scenario: false
  use_magnanti_wong: false
  mw_core_alpha: 0.3
  use_dual_slopes: true
  S: 15
  Wmax_minutes: 60
  # The policy regime. p in slot units would be 56/30; stating it in minutes is what
  # keeps it comparable across resolutions (D50, D53).
  p_minutes: 56.0
  recourse_resolution: minute
  departure_policy: start
  degenerate_cut_probe_top_k: 6
  degenerate_cut_zero_tol: 1.0e-9

solver:
  # High on purpose: the wall clock below is what must bind.
  max_iterations: 400
  tolerance: 0.001
  total_time_limit_s: 300
  stall_max_no_improve_iters: 0
  stall_min_abs_improve: 1.0
  stall_min_rel_improve: 0.002
  master_solver: cplex
  subproblem_solver: cplex_direct
  solver_tee: false

tolerances:
  eps_bin: 1.0e-5
  eps_feas: 1.0e-7
  eps_cut: 1.0e-8
  eps_hash: 1.0e-6
